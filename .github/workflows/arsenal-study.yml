name: HD2 Arsenal evidence integrity
on:
  pull_request:
    paths:
      - 'research/hd2-arsenal-study-2026-11-17/**'
      - 'data/software/arsenal-expanded.json'
      - 'tests/arsenal_study_test.py'
      - '.github/workflows/arsenal-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/arsenal_study_test.py
      - run: python3 scripts/build_software_catalog.py --check
