name: Offline search R&D
on:
  pull_request:
    paths:
      - 'research/offline-compatible-search-2026-11-15/**'
      - '.github/workflows/offline-search-rd.yml'
  workflow_dispatch:
jobs:
  actual-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Equivalent-runtime comparison
        run: node research/offline-compatible-search-2026-11-15/compare.cjs > comparison-receipt.json
      - name: Actual local UI comparison
        run: node research/offline-compatible-search-2026-11-15/browser.cjs > browser-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-search-rd-receipts
          path: '*-receipt.json'
