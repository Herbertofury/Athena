name: Athena software publication preparation
on:
  workflow_dispatch:
  push:
    branches: ['feat/software-discovery-wave2-complete-20261115']
    paths:
      - 'data/software/**'
      - 'src/software/**'
      - 'scripts/build_software_catalog.py'
      - 'scripts/prepare_software_publication.py'
      - 'tests/software*'
      - '.github/workflows/athena-software-prepare.yml'
permissions:
  contents: read
concurrency:
  group: software-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'Herbertofury/Athena' && startsWith(github.ref, 'refs/heads/feat/software-discovery-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild reviewed software outputs
        run: python3 scripts/prepare_software_publication.py
      - run: npm run test:software
      - name: Commit generated files to this feature branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- dist/workspaces/software config/runtime-public-preview.json wiki/Software-*.md research/software-expansion-2026-11-15/coverage.json research/software-expansion-2026-11-15/refresh-queue.json research/software-expansion-2026-11-15/expansion-progress.json
          if git diff --cached --quiet; then
            echo 'Software outputs already match reviewed sources.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate software catalog, coverage, Wiki and runtime hashes'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Generated software publication commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
