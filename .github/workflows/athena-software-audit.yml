name: Athena software source audit
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/software/**'
      - 'src/software/**'
      - 'scripts/build_software_catalog.py'
      - 'scripts/check_software_links.py'
      - 'scripts/report_software_coverage.py'
      - 'scripts/software_browser_checks.cjs'
      - 'tests/software*'
      - '.github/workflows/athena-software-audit.yml'
permissions:
  contents: read
concurrency:
  group: software-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:software
      - run: npx playwright install --with-deps chromium
      - run: npm run test:software:browser
      - name: Report evidence refresh and category coverage
        run: python3 scripts/report_software_coverage.py --output software-refresh-report.json
      - name: Audit official links and provenance sources
        run: python3 scripts/check_software_links.py --workers 16 --timeout 12 --output software-link-report.json --strict
      - name: Retain source audit and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-software-verification
          path: |
            software-link-report.json
            software-refresh-report.json
            browser-results/software/
          if-no-files-found: ignore
