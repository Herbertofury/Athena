name: Video learning evidence contracts
on:
  pull_request:
    paths:
      - 'scripts/video_learning.py'
      - 'scripts/video_channel.py'
      - 'tests/video_channel_test.py'
      - 'tests/video_learning_test.py'
      - 'tests/video-workspace.test.cjs'
      - 'dist/workspaces/video/**'
      - '.github/workflows/video-learning.yml'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p video_learning_test.py -v
      - run: python -m unittest discover -s tests -p video_channel_test.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/video-workspace.test.cjs
