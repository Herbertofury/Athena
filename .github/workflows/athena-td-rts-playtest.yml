name: Athena Tower Defense RTS playtest
on:
  pull_request:
    paths:
      - 'engines/tower-defense-rts/**'
      - '.github/workflows/athena-td-rts-playtest.yml'
  push:
    branches: [main]
    paths:
      - 'engines/tower-defense-rts/**'
      - '.github/workflows/athena-td-rts-playtest.yml'
permissions:
  contents: read
jobs:
  outpost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engines/tower-defense-rts
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 test --offline --locked --release
