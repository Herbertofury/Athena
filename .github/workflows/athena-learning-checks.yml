name: Athena learning checks
on:
  push:
    paths-ignore: ['engineering/**', 'migration/**']
  pull_request:
    paths-ignore: ['engineering/**', 'migration/**']
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Generated curriculum is current
        run: git diff --exit-code -- src dist/catalog.js docs/certificates docs/shared docs/paths docs/README.md wiki
