name: Game Systems Exchange validation
on:
  push:
    branches: [main]
    paths:
      - 'guidance/registry/shared-capabilities.json'
      - 'guidance/schemas/**'
      - 'docs/GAME-SYSTEMS-EXCHANGE.md'
      - 'docs/ENGINE-FOUNDRY.md'
      - 'docs/PORTFOLIO-ALIGNMENT.md'
      - 'engines/**'
      - 'scripts/verify_engine_intake.py'
      - 'scripts/validate_game_systems.py'
      - 'tests/test_engine_intake.py'
      - 'tests/test_game_systems_registry.py'
      - '.github/workflows/game-systems-exchange.yml'
  pull_request:
    paths:
      - 'guidance/registry/shared-capabilities.json'
      - 'guidance/schemas/**'
      - 'docs/GAME-SYSTEMS-EXCHANGE.md'
      - 'docs/ENGINE-FOUNDRY.md'
      - 'docs/PORTFOLIO-ALIGNMENT.md'
      - 'engines/**'
      - 'scripts/verify_engine_intake.py'
      - 'scripts/validate_game_systems.py'
      - 'tests/test_engine_intake.py'
      - 'tests/test_game_systems_registry.py'
      - '.github/workflows/game-systems-exchange.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate source-pinned game capabilities
        run: python scripts/validate_game_systems.py
      - name: Verify immutable engine source intake
        run: python scripts/verify_engine_intake.py
      - name: Test engine intake and registry contracts
        run: python -m unittest discover -s tests -p 'test_*game_systems*.py' -v && python -m unittest discover -s tests -p test_engine_intake.py -v

  survivor-spawn-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reproduce exact source-derived survivor spawn rules
        run: node engines/roguelite/tools/build-survivor-spawns.mjs --check
      - name: Prove complete headless spawn replay against pinned GameSync
        run: node --test engines/roguelite/tests/spawn-director.test.mjs
      - name: Verify original gem pickup and level gates against GameSync
        run: node engines/roguelite/tools/build-survivor-pickups.mjs --check && node --test engines/roguelite/tests/pickup-formulas.test.mjs
      - name: Replay original movement dash and contact against GameSync
        run: node engines/roguelite/tools/build-survivor-movement.mjs --check && node --test engines/roguelite/tests/movement-formulas.test.mjs && node engines/roguelite/examples/demo-encounter-lane.mjs
      - name: Replay legacy upgrade offers and choice effects against GameSync
        run: node engines/roguelite/tools/build-survivor-upgrades.mjs --check && node --test engines/roguelite/tests/upgrade-draft.test.mjs
      - name: Replay full legacy combat and entropy against the original GameSync update
        run: node engines/roguelite/tools/build-survivor-combat.mjs --check && node --test engines/roguelite/tests/legacy-survivor-run.test.mjs
      - name: Generate the standalone offline arena
        run: node engines/roguelite/tools/build-survivor-arena.mjs
      - name: Install locked browser-test dependency
        run: npm ci --ignore-scripts
      - name: Install Chromium for offline file acceptance
        run: npx playwright install chromium
      - name: Exercise every marathon boundary and endless wave with real simulated inputs
        run: node --test engines/roguelite/tests/arena-formats.test.mjs
      - name: Replay exact Arena input tapes and reject malformed or altered files
        run: node --test engines/roguelite/tests/arena-replay.test.mjs
      - name: Hunt roaming geodes and fleeing goblins; collect and replay exact rewards
        run: node --test engines/roguelite/tests/roaming-points.test.mjs
      - name: Play the generated offline arena in Chromium
        run: node engines/roguelite/tests/arena-browser.proof.mjs
      - name: Retain the exact tested offline HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: survivor-arena-${{ matrix.os }}
          path: Athena-Survivor-Arena.html
          if-no-files-found: error
          retention-days: 14
      - name: Reproduce and replay pinned city collision and interior transitions
        run: node engines/mascot-open-world/tools/build-city-traversal.mjs --check && node --test engines/mascot-open-world/tests/city-traversal.test.mjs
      - name: Walk the generated offline city in Chromium
        run: node engines/mascot-open-world/tools/build-city-preview.mjs && node engines/mascot-open-world/tests/city-browser.proof.mjs
      - name: Retain the exact tested city HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: midnight-city-walk-${{ matrix.os }}
          path: Athena-Midnight-City-Walk.html
          if-no-files-found: error
          retention-days: 14
      - name: Validate portable card-game tapes and real match resume
        run: node --test engines/card-game/tests/*.test.mjs
      - name: Recreate a full winning card-game tape
        run: |
          node engines/card-game/build-replay.mjs card-game-proof
          node card-game-proof/tape-cli.mjs demo Warden-Duel-Sample.json
          node card-game-proof/tape-cli.mjs verify Warden-Duel-Sample.json
      - name: Retain the actual playable card tape
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: warden-duel-tape-${{ matrix.os }}
          path: Warden-Duel-Sample.json
          if-no-files-found: error
          retention-days: 14
      - name: Play the offline Warden Duel and interchange Node and browser tapes
        run: |
          node engines/card-game/build-browser.mjs
          node engines/card-game/tests/warden-browser.proof.mjs
      - name: Retain the exact tested Warden Duel page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: warden-duel-page-${{ matrix.os }}
          path: Athena-Warden-Duel.html
          if-no-files-found: error
          retention-days: 14
      - name: Run the offline spawn host demo
        run: node engines/roguelite/examples/demo-spawn-lane.mjs 42 300
