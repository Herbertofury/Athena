name: Game Systems Exchange validation
on:
  push:
    branches: [main]
    paths:
      - 'guidance/registry/shared-capabilities.json'
      - 'guidance/schemas/**'
      - 'docs/GAME-SYSTEMS-EXCHANGE.md'
      - 'docs/ENGINE-FOUNDRY.md'
      - 'docs/PORTFOLIO-ALIGNMENT.md'
      - 'engines/**'
      - 'scripts/verify_engine_intake.py'
      - 'scripts/validate_game_systems.py'
      - 'tests/test_engine_intake.py'
      - 'tests/test_game_systems_registry.py'
      - '.github/workflows/game-systems-exchange.yml'
  pull_request:
    paths:
      - 'guidance/registry/shared-capabilities.json'
      - 'guidance/schemas/**'
      - 'docs/GAME-SYSTEMS-EXCHANGE.md'
      - 'docs/ENGINE-FOUNDRY.md'
      - 'docs/PORTFOLIO-ALIGNMENT.md'
      - 'engines/**'
      - 'scripts/verify_engine_intake.py'
      - 'scripts/validate_game_systems.py'
      - 'tests/test_engine_intake.py'
      - 'tests/test_game_systems_registry.py'
      - '.github/workflows/game-systems-exchange.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate source-pinned game capabilities
        run: python scripts/validate_game_systems.py
      - name: Verify immutable engine source intake
        run: python scripts/verify_engine_intake.py
      - name: Test engine intake and registry contracts
        run: python -m unittest discover -s tests -p 'test_*game_systems*.py' -v && python -m unittest discover -s tests -p test_engine_intake.py -v

  survivor-spawn-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reproduce exact source-derived survivor spawn rules
        run: node engines/roguelite/tools/build-survivor-spawns.mjs --check
      - name: Prove complete headless spawn replay against pinned GameSync
        run: node --test engines/roguelite/tests/spawn-director.test.mjs
      - name: Verify original gem pickup and level gates against GameSync
        run: node engines/roguelite/tools/build-survivor-pickups.mjs --check && node --test engines/roguelite/tests/pickup-formulas.test.mjs
      - name: Replay original movement dash and contact against GameSync
        run: node engines/roguelite/tools/build-survivor-movement.mjs --check && node --test engines/roguelite/tests/movement-formulas.test.mjs && node engines/roguelite/examples/demo-encounter-lane.mjs
      - name: Replay legacy upgrade offers and choice effects against GameSync
        run: node engines/roguelite/tools/build-survivor-upgrades.mjs --check && node --test engines/roguelite/tests/upgrade-draft.test.mjs
      - name: Run the offline spawn host demo
        run: node engines/roguelite/examples/demo-spawn-lane.mjs 42 300
