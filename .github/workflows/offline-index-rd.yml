name: Offline index lifecycle R&D
on:
  pull_request:
    paths:
      - 'research/offline-index-lifecycle-2026-11-15/**'
      - '.github/workflows/offline-index-rd.yml'
  workflow_dispatch:
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node research/offline-index-lifecycle-2026-11-15/test.cjs > index-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-index-${{ matrix.os }}
          path: index-receipt.json
