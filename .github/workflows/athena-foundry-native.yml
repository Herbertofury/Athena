name: Athena native Foundry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-foundry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      ATHENA_FOUNDRY_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - name: Native store formatting
        run: cargo fmt --manifest-path crates/athena-foundry-store/Cargo.toml -- --check
      - name: Native store tests
        run: cargo test --locked --manifest-path crates/athena-foundry-store/Cargo.toml
      - name: Native store strict lint
        run: cargo clippy --locked --manifest-path crates/athena-foundry-store/Cargo.toml --all-targets -- -D warnings
      - name: Build local bridge executable
        run: cargo build --locked --manifest-path crates/athena-foundry-store/Cargo.toml
      - name: Native authoring and real HTTP SQLite integration
        run: npm run test:foundry-native
      - if: runner.os == 'Linux'
        name: Original-data recovery and conversion fidelity
        env:
          ATHENA_NATIVE_BIN: ${{ github.workspace }}/crates/athena-foundry-store/target/debug/athena-foundry-store
          ATHENA_CATALOG: ${{ github.workspace }}/dist/workspaces/foundry/catalog.json
          ATHENA_LAYOUT_MODEL: ${{ github.workspace }}/dist/workspaces/foundry/layout-state.mjs
        run: |
          python3 -m unittest discover -s tools/foundry-recovery/capsule -p 'test_*.py'
          python3 -m unittest discover -s tools/foundry-recovery/sqlite -p 'test_*.py'
          python3 -m unittest discover -s tools/foundry-recovery/scrapbook -p 'test_*.py'
      - name: Separate original native snapshot preservation
        run: python -m unittest discover -s tools/foundry-recovery/snapshot -v
      - name: Original MusicHub offline conversion
        run: python -m unittest discover -s tools/foundry-recovery/music -v
      - name: Install Chromium for real native-profile UI checks
        run: npx playwright install chromium
      - name: Browser to native SQLite acceptance
        run: node scripts/test_foundry_native_browser.mjs
      - name: Restored source-feature browser acceptance
        run: node scripts/test_foundry_parity_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-foundry-${{ matrix.os }}
          path: |
            browser-results/foundry-native/
            browser-results/foundry-parity/
          if-no-files-found: error
