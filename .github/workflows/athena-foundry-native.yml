name: Athena native Foundry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-foundry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      ATHENA_FOUNDRY_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact authored object labels without changing the native database catalog
        run: python scripts/build_foundry_catalog_labels.py --check
      - name: Verify the artist index projection against pinned source
        run: python scripts/build_foundry_artist_index.py --check
      - name: Record actual Python SQLite runtime
        run: python -c "import json,sqlite3,sys; print(json.dumps({'python':sys.version,'sqlite':sqlite3.sqlite_version,'source_id':sqlite3.connect(':memory:').execute('select sqlite_source_id()').fetchone()[0],'wal_recovery_allowed':sqlite3.sqlite_version_info >= (3,54,0)}))"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - name: Prove all ten artist concept plates and twenty bounded weather choices
        run: node --test tests/artist-concept.test.mjs
      - name: Recheck the pinned Survivor Arena and Midnight City engine inputs
        run: |
          node engines/roguelite/tools/build-survivor-spawns.mjs --check
          node engines/roguelite/tools/build-survivor-pickups.mjs --check
          node engines/roguelite/tools/build-survivor-movement.mjs --check
          node engines/roguelite/tools/build-survivor-upgrades.mjs --check
          node engines/roguelite/tools/build-survivor-combat.mjs --check
          node engines/mascot-open-world/tools/build-city-traversal.mjs --check
          node --test engines/roguelite/tests/*.test.mjs engines/mascot-open-world/tests/*.test.mjs
      - name: Rebuild pinned Warden Duel native assets and verify card rules and tapes
        run: |
          node engines/card-game/build-native-rules.mjs --check
          node --test engines/card-game/tests/*.test.mjs
      - name: Native store formatting
        run: cargo fmt --manifest-path crates/athena-foundry-store/Cargo.toml -- --check
      - name: Native store tests
        run: cargo test --locked --manifest-path crates/athena-foundry-store/Cargo.toml
      - name: Native store strict lint
        run: cargo clippy --locked --manifest-path crates/athena-foundry-store/Cargo.toml --all-targets -- -D warnings
      - name: Build local bridge executable
        run: cargo build --locked --manifest-path crates/athena-foundry-store/Cargo.toml
      - name: Build unified evidence and authoring engine
        run: cargo build --locked --manifest-path engineering/apps/atlas-lab/Cargo.toml
      - name: Build and extract unsigned candidate from exact current binaries
        run: python scripts/package_candidate.py --binary crates/athena-foundry-store/target/debug/athena-foundry-store${{ runner.os == 'Windows' && '.exe' || '' }} --engine engineering/apps/atlas-lab/target/debug/atlas-lab${{ runner.os == 'Windows' && '.exe' || '' }} --platform ${{ runner.os == 'Windows' && 'windows' || 'linux' }} --output candidate-artifact --extract-to candidate-extracted
      - name: Verify browser-authored Continuity archive through extracted native CLI
        run: node scripts/test_continuity_artifact_verifier.mjs candidate-extracted
      - name: Verify saved Constellation Drive backup sets without provider access
        run: node --test tests/constellation-drive-bundle.test.cjs
      - name: Extracted native Constellation v7 export dry run
        run: python scripts/test_constellation_review.py candidate-extracted
      - name: Portable Feature Foundry v24 review, import and history archive
        run: python native/foundry/tests/portable_legacy_acceptance.py candidate-extracted
      - name: Extracted portable Projects and Continuity backup admission
        env:
          ATHENA_BACKUP_TEST_RUNTIME: ${{ github.workspace }}/candidate-extracted/runtime
        run: node --test tests/project-continuity-backup-admission.test.cjs
      - name: Extracted read-only dual-pin governance audit
        run: python scripts/test_portable_governance_audit.py candidate-extracted
      - name: Unified dual-store HTTP acceptance
        env:
          ATHENA_UNIFIED_ENGINE: ${{ github.workspace }}/engineering/apps/atlas-lab/target/debug/atlas-lab${{ runner.os == 'Windows' && '.exe' || '' }}
          ATHENA_FOUNDRY_STORE_BINARY: ${{ github.workspace }}/crates/athena-foundry-store/target/debug/athena-foundry-store${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python native/foundry/tests/unified_http.py
      - name: Portable unified process acceptance outside checkout
        env:
          ATHENA_UNIFIED_ENGINE: ${{ github.workspace }}/engineering/apps/atlas-lab/target/debug/atlas-lab${{ runner.os == 'Windows' && '.exe' || '' }}
          ATHENA_FOUNDRY_STORE_BINARY: ${{ github.workspace }}/crates/athena-foundry-store/target/debug/athena-foundry-store${{ runner.os == 'Windows' && '.exe' || '' }}
          ATHENA_PORTABLE_UNIFIED: '1'
        run: python native/foundry/tests/unified_http.py
      - name: Native authoring and real HTTP SQLite integration
        run: npm run test:foundry-native
      - if: runner.os == 'Linux'
        name: Original-data recovery and conversion fidelity
        env:
          ATHENA_NATIVE_BIN: ${{ github.workspace }}/crates/athena-foundry-store/target/debug/athena-foundry-store
          ATHENA_CATALOG: ${{ github.workspace }}/dist/workspaces/foundry/catalog.json
          ATHENA_LAYOUT_MODEL: ${{ github.workspace }}/dist/workspaces/foundry/layout-state.mjs
        run: |
          python3 -m unittest discover -s tools/foundry-recovery/capsule -p 'test_*.py'
          python3 -m unittest discover -s tools/foundry-recovery/archive -p 'test_*.py' -v
          python3 -m unittest discover -s tools/foundry-recovery/scrapbook -p 'test_*.py'
      - name: Scrapbook capsule conversion and read-only verification CLI
        run: python -m unittest discover -s tools/foundry-recovery/scrapbook -p 'test_*cli.py' -v
      - name: Standalone SQLite recovery and handle lifetime
        run: python -m unittest discover -s tools/foundry-recovery/sqlite -v
      - name: Separate original native snapshot preservation
        run: python -m unittest discover -s tools/foundry-recovery/snapshot -v
      - name: Original MusicHub offline conversion
        run: python -m unittest discover -s tools/foundry-recovery/music -v
      - name: Install Chromium for real native-profile UI checks
        run: npx playwright install chromium
      - name: Real Chromium one-shot local backup worker from extracted package
        env:
          ATHENA_BACKUP_TEST_RUNTIME: ${{ github.workspace }}/candidate-extracted/runtime
          ATHENA_TEST_REAL_BACKUP_WORKER: '1'
        run: node --test tests/portable-backup-worker.test.cjs
      - name: Mounted Projects large backup review and exact confirmation in Chromium
        env:
          ATHENA_BACKUP_TEST_RUNTIME: ${{ github.workspace }}/candidate-extracted/runtime
          ATHENA_TEST_REAL_BACKUP_WORKER: '1'
        run: node --test tests/projects-merge-review.test.cjs
      - name: Browser to native SQLite acceptance
        run: node scripts/test_foundry_native_browser.mjs
      - name: Unified Lab and Foundry browser acceptance
        env:
          ATHENA_PORTABLE_UNIFIED: '1'
          ATHENA_UNIFIED_ENGINE: ${{ github.workspace }}/engineering/apps/atlas-lab/target/debug/atlas-lab${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node scripts/test_foundry_native_browser.mjs
      - name: Extracted candidate archive actual browser acceptance
        env:
          ATHENA_UNIFIED_ENGINE: ${{ github.workspace }}/engineering/apps/atlas-lab/target/debug/atlas-lab${{ runner.os == 'Windows' && '.exe' || '' }}
          ATHENA_TEST_PORTABLE_PACKAGE: ${{ github.workspace }}/candidate-extracted
        run: |
          node scripts/test_foundry_native_browser.mjs
          python -B candidate-extracted/launch.py --verify-only
      - name: Extracted Windows directory report in Chromium
        if: runner.os == 'Windows'
        env:
          ATHENA_PUBLIC_ROOT: candidate-extracted/runtime
          ATHENA_TEST_PACKAGED_WIN_OBSERVATION: candidate-extracted/atlas-lab.exe
        run: node scripts/test_storage_compare_browser.cjs
      - name: Extracted Foundry recovery capsule and original room editor
        env:
          ATHENA_BROWSER_ROOT: candidate-extracted/runtime
        run: node scripts/test_foundry_semantic_browser.cjs
      - name: Extracted Foundry stable layer rows and keyboard focus in Chromium
        env:
          ATHENA_BROWSER_ROOT: candidate-extracted/runtime
        run: node scripts/test_foundry_layers_browser.cjs
      - name: Bounded authoring and oversized recovery in Chromium
        run: |
          node scripts/test_foundry_capacity_browser.mjs
          node scripts/test_foundry_save_outcome_browser.mjs
      - name: Local PNG preview, room routing and cleanup in Chromium
        env:
          ATHENA_BROWSER_OUTPUT: browser-results/foundry-local-image
        run: node scripts/test_foundry_local_image_browser.cjs
      - name: Synthetic local video replacement and route recovery in Chromium
        env:
          ATHENA_BROWSER_OUTPUT: browser-results/foundry-video-routing
        run: node scripts/test_foundry_video_routing.cjs
      - name: Current-theme catalog spawning and recovery in Chromium
        env:
          ATHENA_BROWSER_OUTPUT: browser-results/foundry-asset-library
          ATHENA_BROWSER_ROOT: candidate-extracted/runtime
        run: node scripts/test_foundry_asset_library_browser.cjs
      - name: Actor grab offset and drag-grid regressions in Chromium
        env:
          ATHENA_BROWSER_OUTPUT: browser-results/foundry-drag-offset
        run: node scripts/test_foundry_drag_offset_browser.cjs
      - name: Existing release-grid regression in Chromium
        env:
          ATHENA_BROWSER_OUTPUT: browser-results/foundry-drag-grid
        run: node scripts/test_foundry_drag_grid_browser.cjs
      - name: Retain only fully tested unsigned evaluation bundle
        uses: actions/upload-artifact@v4
        with:
          name: athena-unified-candidate-${{ matrix.os }}
          path: candidate-artifact/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-foundry-${{ matrix.os }}
          path: |
            browser-results/foundry-native/
            browser-results/unified-native/
            browser-results/portable-artifact/
            browser-results/foundry-capacity/
            browser-results/foundry-local-image/
            browser-results/foundry-video-routing/
            browser-results/foundry-asset-library/
            browser-results/foundry-drag-offset/
            browser-results/foundry-drag-grid/
            browser-results/foundry-layers/
            browser-results/storage-windows-observation*.png
          if-no-files-found: error
