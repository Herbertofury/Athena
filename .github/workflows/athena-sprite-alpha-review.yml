name: Athena scoped alpha review
on:
  pull_request:
    paths:
      - 'tools/sprite-alpha-review/**'
      - '.github/workflows/athena-sprite-alpha-review.yml'
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/sprite-alpha-review
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Check source pixels and strict bounded inputs on both systems
        run: python -m unittest -v test_audit.py
