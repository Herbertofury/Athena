name: Athena mod knowledge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-knowledge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/athena-mod-knowledge/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/athena-mod-knowledge/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/athena-mod-knowledge/Cargo.toml --all-targets -- -D warnings
