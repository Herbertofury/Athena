name: Athena Guidance
on:
  pull_request:
    paths: ['guidance/**', 'docs/integration/AGENT-GUIDANCE.md', '.github/workflows/athena-guidance.yml']
  push:
    branches: [main]
    paths: ['guidance/**', 'docs/integration/AGENT-GUIDANCE.md', '.github/workflows/athena-guidance.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python guidance/tools/repository_governance.py check
      - run: python -m unittest discover -s guidance/tests -v
