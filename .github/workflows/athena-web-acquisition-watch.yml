name: Athena web acquisition discovery
on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: athena-web-acquisition-discovery
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Collect public GitHub release metadata and candidate leads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python guidance/tools/web_acquisition_watch.py --output web-acquisition-report.json
      - name: Retain reviewable observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-acquisition-observations
          retention-days: 14
          path: web-acquisition-report.json
          if-no-files-found: error
