[package]
name = "atlas-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
getrandom = "=0.4.3"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "signal", "sync"] }

sha2 = { version = "=0.11.1", default-features = false }

[build-dependencies]
sha2 = { version = "=0.11.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

# Experimental backend is compiled only by Windows tests, never production.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemServices"] }
